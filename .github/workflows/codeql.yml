name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 9am UTC, alongside the other security checks.
    - cron: '0 9 * * 1'

# Least privilege: CodeQL needs to read the code and upload its results.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          languages: ${{ matrix.language }}
          # TypeScript is interpreted; no compiler invocation is needed.
          build-mode: none
          # Excludes js/missing-rate-limiting (unmodelable custom limiter — see
          # the config file's header); every other default query stays enabled.
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          category: /language:${{ matrix.language }}
