name: Release @adtraffic/mcp

# Publishes the MCP package to npm with build provenance. Triggered by pushing a
# tag like `mcp-v0.1.0`, or manually. Requires an NPM_TOKEN secret (an npm
# automation/granular token with publish rights to @adtraffic/mcp); the workflow
# is inert until both the tag and the secret exist.
on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm build provenance (--provenance) via OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # The MCP package bundles @adtraffic/shared from its built dist, so shared
      # must be compiled before mcp's prepack build runs during publish.
      - run: npm run build --workspace=shared
      # `npm publish` runs mcp's prepack (fresh tsup build) and prepublishOnly
      # (typecheck + lint + test) automatically, then publishes with provenance.
      - name: Publish with provenance
        run: npm publish --workspace=@adtraffic/mcp --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
