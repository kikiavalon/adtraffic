name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: '0 9 * * 1'

# Least privilege by default; jobs that need more widen it locally.
permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Print full npm audit report
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Fail on production high/critical or any critical (allowlisted)
        # Gate the shipped (production) tree at `high`, and the full tree at
        # `critical` (so a dev-tooling critical still fails, as the old gate did).
        # A small allowlist covers advisories with no clean fix today — each is a
        # ReDoS reachable only through developer-fixed route/glob patterns, never
        # from request input, and the real fixes (express 4->5, or npm overrides
        # that force a full lockfile regeneration of ~180 packages including a
        # canvas downgrade) are riskier than the advisories. Revisit when upstream
        # releases land. `npm audit` exits nonzero whenever any vuln exists, so its
        # output is captured to files (the redirect + `|| true` keep that exit off
        # the pipeline) and the pass/fail decision is made solely by the check below.
        #   path-to-regexp  GHSA-37ch-88jc-xwx2  express@4's legacy 0.1.x router
        #   brace-expansion GHSA-f886-m6hf-6m8v  prod via google-auth-library, exceljs
        #   minimatch       GHSA-3ppc-4f35-3m26  prod via google-auth-library, exceljs
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/prod-audit.json" 2>/dev/null || true
          npm audit --json > "$RUNNER_TEMP/full-audit.json" 2>/dev/null || true
          node -e "
            const fs = require('fs');
            // Fail closed: if npm audit produced no parseable JSON, treat it as a
            // failure rather than silently passing.
            const read = (f) => {
              const raw = fs.readFileSync(f, 'utf8');
              return JSON.parse(raw).vulnerabilities || {};
            };
            let prod, full;
            try {
              prod = read(process.env.RUNNER_TEMP + '/prod-audit.json');
              full = read(process.env.RUNNER_TEMP + '/full-audit.json');
            } catch (err) {
              console.error('Could not read npm audit output:', err.message);
              process.exit(1);
            }
            const ALLOW = new Set(['path-to-regexp', 'brace-expansion', 'minimatch']);
            const blocking = new Map();
            for (const [name, v] of Object.entries(prod)) {
              if ((v.severity === 'high' || v.severity === 'critical') && !ALLOW.has(name)) blocking.set(name, v.severity);
            }
            for (const [name, v] of Object.entries(full)) {
              if (v.severity === 'critical' && !ALLOW.has(name)) blocking.set(name, v.severity);
            }
            if (blocking.size > 0) {
              console.error('Blocking vulnerabilities:', [...blocking].map((e) => e[0] + ' (' + e[1] + ')').join(', '));
              process.exit(1);
            }
            console.log('No blocking production high/critical or unlisted critical vulnerabilities.');
          "

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lockfile-integrity:
    name: Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Verify lockfile is in sync
        run: npm ci --ignore-scripts
      - name: Verify no floating versions
        run: |
          node -e "
            const fs = require('fs');
            const pkgFiles = [
              'package.json',
              'backend/package.json',
              'webapp/package.json',
              'shared/package.json',
              'companion/package.json'
            ];
            let hasFloating = false;
            for (const file of pkgFiles) {
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              for (const depType of ['dependencies', 'devDependencies']) {
                if (!pkg[depType]) continue;
                for (const [name, version] of Object.entries(pkg[depType])) {
                  if (name.startsWith('@adtraffic/')) continue;
                  if (typeof version === 'string' && (version.startsWith('^') || version.startsWith('~'))) {
                    console.error(\`FLOATING VERSION: \${file} -> \${name}: \${version}\`);
                    hasFloating = true;
                  }
                }
              }
            }
            if (hasFloating) process.exit(1);
            console.log('All dependency versions are pinned');
          "

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check for problematic licenses
        run: |
          npx license-checker --production --failOn "GPL-3.0;AGPL-3.0;SSPL-1.0" --summary

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adtraffic
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: adtraffic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adtraffic -d adtraffic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://adtraffic:testpass@localhost:5432/adtraffic_test
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=shared
      - run: npm test
