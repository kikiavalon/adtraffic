services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - backend-data:/app/backend/data

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
